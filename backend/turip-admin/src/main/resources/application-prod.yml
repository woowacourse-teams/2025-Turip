spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: ${MYSQL_URL}
    username: ${MYSQL_USERNAME}
    password: ${MYSQL_PASSWORD}
  jpa:
    properties:
      hibernate:
        format_sql: false
    show-sql: false
jwt:
  access-token-expiration-ms: 10800000  # 3시간

firebase:
  service-account-key-path: classpath:firebase-service-account-prod.json
