spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${MYSQL_URL}
    username: turip
    password: turip_pw

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        validator:
          apply_to_ddl: false

  sql:
    init:
      mode: never

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: true
    encoding: UTF-8

jwt:
  access-token-expiration-ms: 86400000  # 1일

logging:
  level:
    root: WARN
    turip: INFO
