<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>관리자 회원가입 - Turip</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .signup-container {
            background: white;
            border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
            padding: 40px;
            width: 100%;
            max-width: 400px;
        }

        h1 {
            color: #333;
            margin-bottom: 30px;
            text-align: center;
            font-size: 28px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #555;
            font-weight: 500;
        }

        .hint {
            display: block;
            margin-top: 6px;
            color: #999;
            font-size: 12px;
        }

        .password-wrapper {
            position: relative;
        }

        .password-wrapper input[type="password"],
        .password-wrapper input[type="text"] {
            padding-right: 45px;
        }

        input[type="text"],
        input[type="password"],
        input[type="email"] {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 6px;
            font-size: 14px;
            transition: border-color 0.3s;
        }

        input[type="text"]:focus,
        input[type="password"]:focus,
        input[type="email"]:focus {
            outline: none;
            border-color: #667eea;
        }

        .password-toggle {
            position: absolute;
            right: 8px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            cursor: pointer;
            font-size: 20px;
            color: #999;
            padding: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            user-select: none;
        }

        .password-toggle:hover {
            color: #667eea;
        }

        .password-toggle.visible::after {
            content: '';
            position: absolute;
            width: 24px;
            height: 2px;
            background: currentColor;
            transform: rotate(-45deg);
        }

        .button-group {
            margin-top: 30px;
        }

        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-signup {
            background: #667eea;
            color: white;
            margin-bottom: 12px;
        }

        .btn-signup:hover {
            background: #5568d3;
        }

        .btn-back {
            background: #f5f5f5;
            color: #333;
        }

        .btn-back:hover {
            background: #e0e0e0;
        }
    </style>
</head>
<body>
    <div class="signup-container">
        <h1>관리자 회원가입</h1>
        <form id="signupForm">
            <div class="form-group">
                <label for="loginId">아이디</label>
                <input type="text" id="loginId" name="loginId" required>
                <span class="hint">소문자, 숫자, _, - 만 사용 가능 (5~20자)</span>
            </div>
            <div class="form-group">
                <label for="email">이메일</label>
                <input type="email" id="email" name="email" required>
            </div>
            <div class="form-group">
                <label for="loginPassword">비밀번호</label>
                <div class="password-wrapper">
                    <input type="password" id="loginPassword" name="loginPassword" required>
                    <button type="button" class="password-toggle" onclick="togglePassword('loginPassword', this)">
                        👁
                    </button>
                </div>
                <span class="hint">8~20자, 소문자/숫자/특수문자 각 1개 이상 포함</span>
            </div>
            <div class="form-group">
                <label for="confirmPassword">비밀번호 확인</label>
                <div class="password-wrapper">
                    <input type="password" id="confirmPassword" name="confirmPassword" required>
                    <button type="button" class="password-toggle" onclick="togglePassword('confirmPassword', this)">
                        👁
                    </button>
                </div>
            </div>
            <div class="button-group">
                <button type="submit" class="btn-signup">회원가입</button>
                <button type="button" class="btn-back" onclick="location.href='/admin/login'">로그인으로 돌아가기</button>
            </div>
        </form>
    </div>

    <script>
        function togglePassword(inputId, button) {
            const input = document.getElementById(inputId);
            if (input.type === 'password') {
                input.type = 'text';
                button.classList.add('visible');
            } else {
                input.type = 'password';
                button.classList.remove('visible');
            }
        }

        document.getElementById('signupForm').addEventListener('submit', async function(e) {
            e.preventDefault();

            const loginId = document.getElementById('loginId').value;
            const email = document.getElementById('email').value;
            const loginPassword = document.getElementById('loginPassword').value;
            const confirmPassword = document.getElementById('confirmPassword').value;

            // 비밀번호 확인
            if (loginPassword !== confirmPassword) {
                alert('비밀번호가 일치하지 않습니다.');
                return;
            }

            try {
                const response = await fetch('/turip-members', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        loginId: loginId,
                        loginPassword: loginPassword,
                        email: email
                    })
                });

                if (response.ok) {
                    alert('회원가입이 완료되었습니다. 로그인 페이지로 이동합니다.');
                    window.location.href = '/admin/login';
                } else {
                    const errorData = await response.json();
                    alert(errorData.message || '회원가입에 실패했습니다. 입력 정보를 확인해주세요.');
                }
            } catch (error) {
                alert('회원가입 중 오류가 발생했습니다. 다시 시도해주세요.');
            }
        });
    </script>
</body>
</html>
