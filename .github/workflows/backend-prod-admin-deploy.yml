name: prod CI/CD with Docker and Nginx

on:
  push:
    branches: [ 'release-be/**' ]
    paths:
      - 'backend/admin/**'
      - 'backend/build.gradle'
  pull_request:
    branches: [ 'release-be/**' ]
    paths:
      - 'backend/admin/**'
      - 'backend/build.gradle'

jobs:
  build_and_test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set image tag
        id: vars
        run: |
          echo "image_tag=prod-$(TZ=Asia/Seoul date +%Y%m%d-%H%M)-${GITHUB_SHA::7}" >> $GITHUB_OUTPUT

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run Unit Tests (App)
        run: ./gradlew :admin:test

      - name: Build App Jar
        run: ./gradlew :admin:bootJar -x test

      - name: Prepare OpenTelemetry agent
        run: |
          mkdir -p otel
          curl -L -o otel/opentelemetry-javaagent.jar \
          https://github.com/open-telemetry/opentelemetry-java-instrumentation/releases/download/v2.10.0/opentelemetry-javaagent.jar

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: network=host

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/admin.Dockerfile
          platforms: linux/arm64
          push: true
          tags: teamturip/turip-backend:prod-admin-${{ steps.vars.outputs.image_tag }}

  deploy:
    needs: build_and_test
    runs-on: [ self-hosted, turip-server-prod ]
    environment: production
    if: github.event_name == 'push'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Grant execute permission for deploy script
        run: chmod +x /home/ubuntu/deploy/deploy.sh

      - name: Deploy Admin
        env:
          IMAGE_TAG: ${{ needs.build_and_test.outputs.image_tag }}
        run: |
          cd /home/ubuntu/deploy
          if [ ! -f .env ]; then touch .env; fi

          if grep -q "ADMIN_IMAGE_TAG=" .env; then
            sed -i "s/^ADMIN_IMAGE_TAG=.*/ADMIN_IMAGE_TAG=${IMAGE_TAG}/" .env
          else
            echo "ADMIN_IMAGE_TAG=${IMAGE_TAG}" >> .env
          fi
          docker-compose pull admin
          docker-compose up -d admin

