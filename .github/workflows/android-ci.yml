name: Android CI

on:
  pull_request:
    paths: 'android/**'
    branches: [ "develop" ]

jobs:

  build:
    name: Build APK
    runs-on: ubuntu-latest

    defaults:
      run:
        shell: bash
        working-directory: ./android

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Create local.properties
        run: |
          cat > ./local.properties <<'EOF'
          debug_base_url=${{ secrets.DEBUG_BASE_URL }}
          release_base_url=${{ secrets.RELEASE_BASE_URL }}
          client_id=${{ secrets.GOOGLE_CLIENT_ID }}
          google_maps_api_key=${{ secrets.GOOGLE_MAPS_API_KEY }}
          app_link_turip_invitation_host=${{ secrets.APP_LINK_TURIP_INVITATION_HOST }}
          EOF

      - name: Generate Keystores
        run: |
          echo "${{ secrets.DEBUG_KEYSTORE_BASE64 }}" | base64 -d > ./app/debug-keystore.jks
          echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 -d > ./app/release-keystore.jks

      - name: Create keystore.properties
        run: |
          cat > ./keystore.properties <<'EOF'
          debug_store_file=./debug-keystore.jks
          debug_store_password=${{ secrets.DEBUG_STORE_PASSWORD }}
          debug_key_alias=${{ secrets.DEBUG_KEY_ALIAS }}
          debug_key_password=${{ secrets.DEBUG_KEY_PASSWORD }}
          release_store_file=./release-keystore.jks
          release_store_password=${{ secrets.RELEASE_STORE_PASSWORD }}
          release_key_alias=${{ secrets.RELEASE_KEY_ALIAS }}
          release_key_password=${{ secrets.RELEASE_KEY_PASSWORD }}
          EOF

      - name: Write google-services.json for debug
        run: |
          mkdir -p ./app/src/debug
          echo '${{ secrets.GOOGLE_SERVICES_JSON_DEBUG }}' > ./app/src/debug/google-services.json

      - name: Write google-services.json for release
        run: |
          mkdir -p ./app
          echo '${{ secrets.GOOGLE_SERVICES_JSON_RELEASE }}' > ./app/google-services.json

      - name: Build with Gradle
        run: ./gradlew build --stacktrace

  lint:
    name: Ktlint Check
    runs-on: ubuntu-latest
    needs: build

    defaults:
      run:
        shell: bash
        working-directory: ./android

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Create local.properties
        run: |
          cat > ./local.properties <<'EOF'
          debug_base_url=${{ secrets.DEBUG_BASE_URL }}
          release_base_url=${{ secrets.RELEASE_BASE_URL }}
          client_id=${{ secrets.GOOGLE_CLIENT_ID }}
          google_maps_api_key=${{ secrets.GOOGLE_MAPS_API_KEY }}
          app_link_turip_invitation_host=${{ secrets.APP_LINK_TURIP_INVITATION_HOST }}
          EOF

      - name: Generate Keystores
        run: |
          echo "${{ secrets.DEBUG_KEYSTORE_BASE64 }}" | base64 -d > ./app/debug-keystore.jks
          echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 -d > ./app/release-keystore.jks

      - name: Create keystore.properties
        run: |
          cat > ./keystore.properties <<'EOF'
          debug_store_file=./debug-keystore.jks
          debug_store_password=${{ secrets.DEBUG_STORE_PASSWORD }}
          debug_key_alias=${{ secrets.DEBUG_KEY_ALIAS }}
          debug_key_password=${{ secrets.DEBUG_KEY_PASSWORD }}
          release_store_file=./release-keystore.jks
          release_store_password=${{ secrets.RELEASE_STORE_PASSWORD }}
          release_key_alias=${{ secrets.RELEASE_KEY_ALIAS }}
          release_key_password=${{ secrets.RELEASE_KEY_PASSWORD }}
          EOF

      - name: Run ktlintCheck
        run: ./gradlew ktlintCheck --stacktrace

  test:
    name: Run Unit Tests
    runs-on: ubuntu-latest
    needs: build

    defaults:
      run:
        shell: bash
        working-directory: ./android

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Create local.properties
        run: |
          cat > ./local.properties <<'EOF'
          debug_base_url=${{ secrets.DEBUG_BASE_URL }}
          release_base_url=${{ secrets.RELEASE_BASE_URL }}
          client_id=${{ secrets.GOOGLE_CLIENT_ID }}
          google_maps_api_key=${{ secrets.GOOGLE_MAPS_API_KEY }}
          app_link_turip_invitation_host=${{ secrets.APP_LINK_TURIP_INVITATION_HOST }}
          EOF

      - name: Generate Keystores
        run: |
          echo "${{ secrets.DEBUG_KEYSTORE_BASE64 }}" | base64 -d > ./app/debug-keystore.jks
          echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 -d > ./app/release-keystore.jks

      - name: Create keystore.properties
        run: |
          cat > ./keystore.properties <<'EOF'
          debug_store_file=./debug-keystore.jks
          debug_store_password=${{ secrets.DEBUG_STORE_PASSWORD }}
          debug_key_alias=${{ secrets.DEBUG_KEY_ALIAS }}
          debug_key_password=${{ secrets.DEBUG_KEY_PASSWORD }}
          release_store_file=./release-keystore.jks
          release_store_password=${{ secrets.RELEASE_STORE_PASSWORD }}
          release_key_alias=${{ secrets.RELEASE_KEY_ALIAS }}
          release_key_password=${{ secrets.RELEASE_KEY_PASSWORD }}
          EOF

      - name: Write google-services.json for debug
        run: |
          mkdir -p ./app/src/debug
          echo '${{ secrets.GOOGLE_SERVICES_JSON_DEBUG }}' > ./app/src/debug/google-services.json

      - name: Write google-services.json for release
        run: |
          mkdir -p ./app
          echo '${{ secrets.GOOGLE_SERVICES_JSON_RELEASE }}' > ./app/google-services.json

      - name: Run tests
        run: ./gradlew test --stacktrace

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Test Results
          path: "**/test-results/**/*.xml"
