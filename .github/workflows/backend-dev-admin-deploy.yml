name: Admin Service CI/CD

on:
  push:
    branches: [ develop ]
    paths:
      - 'backend/admin/**'
      - 'backend/build.gradle'
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Deploy admin image tag (YYYYMMDD-HHMM-SHA)'
        required: true

jobs:
  build_and_test:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.vars.outputs.image_tag }}
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set image tag
        id: vars
        run: |
          echo "image_tag=$(TZ=Asia/Seoul date +%Y%m%d-%H%M)-${GITHUB_SHA::7}" >> $GITHUB_OUTPUT

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Build Admin Jar
        run: |
          chmod +x gradlew
          ./gradlew :admin:bootJar -x test

      - name: Run Unit Tests (Admin)
        run: ./gradlew :admin:test

      - name: Prepare OpenTelemetry agent
        run: |
          mkdir -p otel
          curl -L -o otel/opentelemetry-javaagent.jar https://github.com/open-telemetry/opentelemetry-java-instrumentation/releases/download/v2.10.0/opentelemetry-javaagent.jar

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: network=host

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Admin image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/admin.Dockerfile
          platforms: linux/arm64
          push: true
          tags: teamturip/turip-backend:dev-admin-${{ steps.vars.outputs.image_tag }}

  deploy:
    needs: build_and_test
    runs-on: [ self-hosted, turip-server-dev ]
    if: github.event_name == 'workflow_dispatch' || needs.build_and_test.result == 'success'

    steps:
      - name: Deploy Admin
        env:
          IMAGE_TAG: ${{ inputs.image_tag || needs.build_and_test.outputs.image_tag }}
        run: |
          cd /home/ubuntu/deploy
          if [ ! -f .env ]; then touch .env; fi
          
          if grep -q "ADMIN_IMAGE_TAG=" .env; then
            sed -i "s/^ADMIN_IMAGE_TAG=.*/ADMIN_IMAGE_TAG=${IMAGE_TAG}/" .env
          else
            echo "ADMIN_IMAGE_TAG=${IMAGE_TAG}" >> .env
          fi
          docker-compose pull admin
          docker-compose up -d admin
