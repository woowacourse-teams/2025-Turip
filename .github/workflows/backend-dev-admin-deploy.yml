name: Admin Service CI/CD

on:
  push:
    branches: [ develop ]
    paths:
      - 'backend/admin/**'
      - 'backend/build.gradle'
  pull_request:
    branches: [ 'release-be/**' ]
    paths:
      - 'backend/admin/**'
      - 'backend/build.gradle'
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Deploy admin image tag (YYYYMMDD-HHMM-SHA)'
        required: true

jobs:
  build_and_test:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.vars.outputs.image_tag }}
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set image tag
        id: vars
        run: |
          echo "image_tag=$(TZ=Asia/Seoul date +%Y%m%d-%H%M)-${GITHUB_SHA::7}" >> $GITHUB_OUTPUT

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Build Admin Jar
        run: |
          chmod +x gradlew
          ./gradlew :admin:bootJar -x test

      - name: Run Unit Tests (Admin)
        run: ./gradlew :admin:test

      - name: Prepare OpenTelemetry agent
        run: |
          mkdir -p otel
          curl -L -o otel/opentelemetry-javaagent.jar https://github.com/open-telemetry/opentelemetry-java-instrumentation/releases/download/v2.10.0/opentelemetry-javaagent.jar

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: network=host

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Admin image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/admin.Dockerfile
          platforms: linux/arm64
          push: true
          tags: teamturip/turip-backend:dev-admin-${{ steps.vars.outputs.image_tag }}

  deploy:
    needs: build_and_test
    runs-on: [ self-hosted, turip-server-dev ]
    if: github.event_name == 'workflow_dispatch' || needs.build_and_test.result == 'success'

    steps:
      - name: Deploy Admin
        env:
          CSV_LINKS_COLLECTION_URL: ${{ secrets.CSV_LINKS_COLLECTION_URL }}
          DOMESTIC_ETC_IMAGE_URL: ${{ secrets.DOMESTIC_ETC_IMAGE_URL }}
          OVERSEAS_ETC_IMAGE_URL: ${{ secrets.OVERSEAS_ETC_IMAGE_URL }}
          OTEL_EXPORTER_OTLP_ENDPOINT: ${{ secrets.OTEL_EXPORTER_OTLP_ENDPOINT }}
          MYSQL_URL: ${{ secrets.MYSQL_URL }}
          MYSQL_USERNAME: ${{ secrets.MYSQL_USERNAME }}
          MYSQL_PASSWORD: ${{ secrets.MYSQL_PASSWORD }}
          FLYWAY_USERNAME: ${{ secrets.FLYWAY_USERNAME }}
          FLYWAY_PASSWORD: ${{ secrets.FLYWAY_PASSWORD }}
          CSV_IMPORT_PASSWORD: ${{ secrets.CSV_IMPORT_PASSWORD }}
          JWT_SECRET_KEY: ${{ secrets.JWT_SECRET_KEY }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
        run: |
          cd /home/ubuntu/deploy
          IMAGE_TAG="${{ github.event.inputs.image_tag || needs.build_and_test.outputs.image_tag }}"
          
          echo "🚀 Admin 배포 시작 (Tag: ${IMAGE_TAG})"
          
          cat <<EOF > .env.tmp
          IMAGE_NAME_PREFIX=dev-app
          IMAGE_NAME_ADMIN_PREFIX=dev-admin
          SPRING_PROFILES_ACTIVE=dev
          NGINX_PORT=8080
          CSV_LINKS_COLLECTION_URL=${CSV_LINKS_COLLECTION_URL}
          DOMESTIC_ETC_IMAGE_URL=${DOMESTIC_ETC_IMAGE_URL}
          OVERSEAS_ETC_IMAGE_URL=${OVERSEAS_ETC_IMAGE_URL}
          OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT}
          MYSQL_URL=${MYSQL_URL}
          MYSQL_USERNAME=${MYSQL_USERNAME}
          MYSQL_PASSWORD=${MYSQL_PASSWORD}
          FLYWAY_USERNAME=${FLYWAY_USERNAME}
          FLYWAY_PASSWORD=${FLYWAY_PASSWORD}
          CSV_IMPORT_PASSWORD=${CSV_IMPORT_PASSWORD}
          JWT_SECRET_KEY=${JWT_SECRET_KEY}
          GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
          EOF
          
          if [ -f .env ]; then
            grep "^APP_IMAGE_TAG=" .env >> .env.tmp || true
          fi
          
          echo "ADMIN_IMAGE_TAG=${IMAGE_TAG}" >> .env.tmp
          
          mv .env.tmp .env
          
          docker-compose pull admin
          docker-compose up -d admin
          
          echo "✅ Admin 배포 완료"
